# server
server:
  port: 8080

# spring
spring:
  application:
    name: order-management-service

  # jpa
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # database
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/order_management
    username: postgres
    password: cfvgb33

  # liquibase
  liquibase:
    change-log: db/changelog/changelog-master.xml

# end-points
end:
  point:
    users: /api/users
    orders: /api/orders
    auth: /api/auth

# jwt
jwt:
  secret: ${JWT_SECRET}
  expiration: 103600000
  refreshExpiration: 604800000

# logging
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.warm4ik.hub.oms: TRACE

# swagger
springdoc:
  api-docs:
    path: "/v1/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
swagger:
  servers:
    first: "http://localhost:8080"
